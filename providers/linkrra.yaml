id: linkrra
name: Synap by Linkrra
description: >-
  OpenAI-compatible API offering Linkrra-operated GPU deployments and separate brokered models.
  The listed GPT-OSS 20B, Gemma 4 26B A4B and Qwen3 Coder 30B A3B deployments have public token prices and served context limits.
  Linkrra reports native MXFP4 for GPT-OSS and AWQ 4-bit for Gemma and Qwen3 Coder; this Gemma deployment accepts text input only.
  As disclosed on 2026-10-21, requests for these three models can still be forwarded to OpenRouter and rejected when Linkrra nodes are unavailable, pending a gateway fix.
  This listing does not guarantee exclusively local request handling or zero retention. Data handling policy: https://synap.linkrra.com/privacy.
api_base_url: https://pool.linkrra.com/v1
auth_type: bearer
regions:
  # Worldwide API access, not guaranteed processing residency. The public feed
  # reported serving nodes in South Korea on 2026-10-21; locations can change.
  - global
compatibility: openai
created_at: "2026-10-21T00:00:00.000Z"
updated_at: "2026-10-21T00:00:00.000Z"
