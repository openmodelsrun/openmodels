id: sber
name: Sber
description: Sber GigaChat API uses OAuth 2.0 access tokens and the https://api.giga.chat/v1 endpoint. The documented API lists GigaChat 2 Lite, Pro and Max, plus GigaChat 3 Ultra for individual Freemium accounts. Open-weight GigaChat 3.1 Lightning and Ultra checkpoints are not confirmed hosted endpoints. Official tariffs are in RUB and depend on account type and plan; no verified USD rates are listed here.
api_base_url: https://api.giga.chat/v1
auth_type: oauth2
regions:
  - ru-central-1
compatibility: custom
