id: flint
name: Recursive Flint
description: Recursive's open-weight mixture-of-experts language model for coding agents, with 39.8B total and approximately 2.5B active parameters per token. Supports text generation, reasoning and multi-turn tool use under Apache 2.0. The released checkpoint configures 262,144 tokens of combined input and output; the developer advertises up to 512K but recommends staying within 256K. OpenRouter currently offers a free endpoint subject to availability and usage limits.
