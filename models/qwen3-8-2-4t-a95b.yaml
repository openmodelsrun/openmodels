id: qwen3-8-2-4t-a95b
name: Qwen 3.8 2.4T-A95B
description: Alibaba's open-weight Max-class Qwen 3.8 model, a sparse Mixture-of-Experts system with 2.4T total parameters and about 95B active parameters per token. The text model targets coding, research, complex reasoning, and long-horizon agentic workflows with a native 262K context window that can be extended to about one million tokens and is served by hosted providers with 1M context.
